[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sales-data-platform-azure"
version = "0.1.0"
description = "Governed foundation for the Northstar Retail Azure sales data platform."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Northstar Retail Data Engineering" }]
dependencies = [
  "azure-identity>=1.24,<2",
  "azure-storage-blob>=12.26,<13",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
sdpa-transform = "sales_data_platform_azure.transformation.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sales_data_platform_azure"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=sales_data_platform_azure --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = [
  "contract: local repository contract tests",
  "integration: local integration-boundary tests that require no cloud access",
]

[tool.coverage.run]
branch = true
source = ["sales_data_platform_azure"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
